<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Task Board</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff;
      overflow-x: hidden;
    }

    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: #111;
      z-index: -1;
    }

    .content {
      position: relative;
      padding: 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 {
      text-align: center;
      margin: 20px 0;
      color: #21cbf3;
      font-size: 2rem;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.4);
    }

    .task-board {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      width: 100%;
      max-width: 1200px;
    }

    .task-card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 20px;
      width: 250px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
      transition: opacity 1s ease, transform 0.3s ease, box-shadow 0.3s ease;
    }

    .task-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 15px #21cbf3;
    }

    .task-card h4 {
      margin: 0 0 10px 0;
      color: #21cbf3;
      font-size: 1.1rem;
    }

    .task-card p {
      margin: 0 0 10px 0;
      color: #eee;
      font-size: 0.95rem;
    }

    button {
      padding: 8px 12px;
      margin: 5px 0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .download-btn { background: #ff9800; color: #fff; }
    .download-btn:hover { background: #e68900; box-shadow: 0 0 10px #ff9800; }

    .done-btn { background: #4caf50; color: #fff; }
    .done-btn:hover { background: #3e8e41; box-shadow: 0 0 10px #4caf50; }

    .completed { background: rgba(76,175,80,0.2); border: 1px solid #4caf50; }
    .countdown { font-weight: bold; color: #ff5252; margin-top: 5px; }
    .fade-out { opacity: 0; }

    @media (max-width: 1024px) {
      .task-card { width: 45%; }
    }

    @media (max-width: 768px) {
      .content { padding: 20px; }
      .task-card { width: 100%; }
      h2 { font-size: 1.6rem; }
      button { font-size: 13px; padding: 10px 14px; }
    }

    @media (max-width: 480px) {
      h2 { font-size: 1.4rem; }
      .task-card { padding: 15px; }
      button { font-size: 12px; padding: 8px 12px; }
    }
  </style>
</head>
<body>
  <canvas id="grid"></canvas>
  <div class="content">
    <h2>Public Tasks</h2>
    <div class="task-board" id="publicBoard"></div>
    <h2>Zei Only Tasks</h2>
    <div class="task-board" id="zeiBoard"></div>
  </div>

  <script>
    // 🔹 Glow Grid Background
    const canvas = document.getElementById("grid");
    const ctx = canvas.getContext("2d");
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    let mouse = { x: -9999, y: -9999 };
    const squareSize = 80;
    const grid = [];

    function initGrid() {
      grid.length = 0;
      for (let x = 0; x < width; x += squareSize) {
        for (let y = 0; y < height; y += squareSize) {
          grid.push({ x, y, alpha: 0, fading: false, lastTouched: 0 });
        }
      }
    }

    function getCellAt(x, y) {
      return grid.find(cell =>
        x >= cell.x && x < cell.x + squareSize &&
        y >= cell.y && y < cell.y + squareSize
      );
    }

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initGrid();
    });

    window.addEventListener("mousemove", (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      const cell = getCellAt(mouse.x, mouse.y);
      if (cell && cell.alpha === 0) {
        cell.alpha = 1;
        cell.lastTouched = Date.now();
        cell.fading = false;
      }
    });

    function drawGrid() {
      ctx.clearRect(0, 0, width, height);
      const now = Date.now();
      for (let cell of grid) {
        if (cell.alpha > 0 && !cell.fading && now - cell.lastTouched > 500) {
          cell.fading = true;
        }
        if (cell.fading) {
          cell.alpha -= 0.02;
          if (cell.alpha <= 0) { cell.alpha = 0; cell.fading = false; }
        }
        if (cell.alpha > 0) {
          const centerX = cell.x + squareSize / 2;
          const centerY = cell.y + squareSize / 2;
          const gradient = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, squareSize);
          gradient.addColorStop(0, `rgba(0, 255, 204, ${cell.alpha})`);
          gradient.addColorStop(1, `rgba(0, 255, 204, 0)`);
          ctx.strokeStyle = gradient;
          ctx.lineWidth = 1.3;
          ctx.strokeRect(cell.x + 0.5, cell.y + 0.5, squareSize - 1, squareSize - 1);
        }
      }
      requestAnimationFrame(drawGrid);
    }
    initGrid();
    drawGrid();

    // 🔹 Admin Task Board Logic
    async function loadAdminTasks() {
      const publicRes = await fetch('https://sharedtask.onrender.com/tasks/public');
      const zeiRes = await fetch('https://sharedtask.onrender.com/tasks/zei');

      const publicTasks = await publicRes.json();
      const zeiTasks = await zeiRes.json();

      const publicBoard = document.getElementById('publicBoard');
      const zeiBoard = document.getElementById('zeiBoard');
      publicBoard.innerHTML = '';
      zeiBoard.innerHTML = '';

      publicTasks.forEach(task => renderTask(task, publicBoard));
      zeiTasks.forEach(task => renderTask(task, zeiBoard));
    }

    function renderTask(task, container) {
      const card = document.createElement('div');
      card.className = 'task-card';
      card.innerHTML = `
        <p><strong>Uploaded by:</strong> ${task.userName || "Anonymous"}</p>
        <h4>${task.fileName}</h4>
        <p>${task.description}</p>
        <button class="download-btn">Download</button>
        <button class="done-btn">Delete</button>
        <div class="countdown"></div>
      `;

      const downloadBtn = card.querySelector('.download-btn');
      downloadBtn.onclick = () => {
        const a = document.createElement('a');
        a.href = 'https://sharedtask.onrender.com' + task.fileUrl;
        a.download = task.fileName;
        a.click();
      };

      const doneBtn = card.querySelector('.done-btn');
      const countdown = card.querySelector('.countdown');
      let deleteTimeout = null, countdownInterval = null, remainingTime = 0;

            doneBtn.onclick = async () => {
        card.classList.add('completed');
        doneBtn.textContent = "Deleting...";
        doneBtn.disabled = true;
        startCountdown(3, async () => {
          await fetch('https://sharedtask.onrender.com/delete/' + task.id, { method: 'DELETE' });
          fadeAndRemove(card);
        });
      };

      function startCountdown(seconds, onFinish) {
        remainingTime = seconds;
        countdown.textContent = "Deleting in " + remainingTime + "s";
        countdownInterval = setInterval(() => {
          remainingTime--;
          countdown.textContent = "Deleting in " + remainingTime + "s";
          if (remainingTime <= 0) clearInterval(countdownInterval);
        }, 1000);
        deleteTimeout = setTimeout(onFinish, seconds * 1000);
      }

      function fadeAndRemove(element) {
        element.classList.add('fade-out');
        setTimeout(() => element.remove(), 1000);
      }

      container.appendChild(card);
    }

    setInterval(loadAdminTasks, 5000);
    loadAdminTasks();
  </script>
</body>
</html>

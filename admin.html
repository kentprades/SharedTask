<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Task Board</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- ✅ Responsive scaling -->
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 40px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #2196f3;
      font-size: 2rem;
    }

    .task-board {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .task-card {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 20px;
      width: 250px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: opacity 1s ease, transform 0.3s ease;
    }

    .task-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    }

    .task-card h4 {
      margin: 0 0 10px 0;
      color: #2196f3;
      font-size: 1.1rem;
    }

    .task-card p {
      margin: 0 0 10px 0;
      color: #555;
      font-size: 0.95rem;
    }

    button {
      padding: 8px 12px;
      margin: 5px 0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s ease;
    }

    .download-btn { background: #ff9800; color: #fff; }
    .download-btn:hover { background: #e68900; }

    .done-btn { background: #4caf50; color: #fff; }
    .done-btn:hover { background: #3e8e41; }

    .completed { background: #d4edda; border-color: #4caf50; }
    .countdown { font-weight: bold; color: red; margin-top: 5px; }
    .fade-out { opacity: 0; }

    /* ✅ Responsive adjustments */
    @media (max-width: 1024px) {
      .task-card { width: 45%; }
    }

    @media (max-width: 768px) {
      body { padding: 20px; }
      .task-card { width: 100%; }
      h2 { font-size: 1.6rem; }
      button { font-size: 13px; padding: 10px 14px; }
    }

    @media (max-width: 480px) {
      h2 { font-size: 1.4rem; }
      .task-card { padding: 15px; }
      button { font-size: 12px; padding: 8px 12px; }
    }
  </style>
</head>
<body>
  <h2>Public Tasks</h2>
  <div class="task-board" id="publicBoard"></div>
  <h2>Zei Only Tasks</h2>
  <div class="task-board" id="zeiBoard"></div>

  <script>
    async function loadAdminTasks() {
      const publicRes = await fetch('https://sharedtask.onrender.com/tasks/public');
      const zeiRes = await fetch('https://sharedtask.onrender.com/tasks/zei');

      const publicTasks = await publicRes.json();
      const zeiTasks = await zeiRes.json();

      const publicBoard = document.getElementById('publicBoard');
      const zeiBoard = document.getElementById('zeiBoard');
      publicBoard.innerHTML = '';
      zeiBoard.innerHTML = '';

      publicTasks.forEach(task => renderTask(task, publicBoard));
      zeiTasks.forEach(task => renderTask(task, zeiBoard));
    }

    function renderTask(task, container) {
      const card = document.createElement('div');
      card.className = 'task-card';
      card.innerHTML = `
        <p><strong>Uploaded by:</strong> ${task.userName || "Anonymous"}</p>
        <h4>${task.fileName}</h4>
        <p>${task.description}</p>
        <button class="download-btn">Download</button>
        <button class="done-btn">Delete</button>
        <div class="countdown"></div>
      `;

      const downloadBtn = card.querySelector('.download-btn');
      downloadBtn.onclick = () => {
        const a = document.createElement('a');
        // ✅ Use /uploads route instead of raw filePath
        a.href = 'https://sharedtask.onrender.com' + task.fileUrl; // ✅ use fileUrl
        a.download = task.fileName;
        a.click();
      };

      const doneBtn = card.querySelector('.done-btn');
      const countdown = card.querySelector('.countdown');
      let deleteTimeout = null, countdownInterval = null, remainingTime = 0;

      doneBtn.onclick = async () => {
        card.classList.add('completed');
        doneBtn.textContent = "Deleting...";
        doneBtn.disabled = true;
        startCountdown(3, async () => {
          await fetch('https://sharedtask.onrender.com/delete/' + task.id, { method: 'DELETE' });
          fadeAndRemove(card);
        });
      };

      function startCountdown(seconds, onFinish) {
        remainingTime = seconds;
        countdown.textContent = "Deleting in " + remainingTime + "s";
        countdownInterval = setInterval(() => {
          remainingTime--;
          countdown.textContent = "Deleting in " + remainingTime + "s";
          if (remainingTime <= 0) clearInterval(countdownInterval);
        }, 1000);
        deleteTimeout = setTimeout(onFinish, seconds * 1000);
      }

      function fadeAndRemove(element) {
        element.classList.add('fade-out');
        setTimeout(() => element.remove(), 1000);
      }

      container.appendChild(card);
    }

    setInterval(loadAdminTasks, 5000);
    loadAdminTasks();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Task</title>
  <style>
    body { font-family: 'Segoe UI', Arial; background: #f4f4f4; margin: 0; padding: 40px; }
    .container {
      max-width: 500px; margin: auto; background: #fff; padding: 30px;
      border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 { text-align: center; margin-bottom: 20px; }
    .drop-box {
      width: 100%; height: 150px; border: 2px dashed #2196f3; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 15px; cursor: pointer; color: #555;
    }
    textarea, select {
      width: 100%; margin-bottom: 15px;
      border: 1px solid #ccc; border-radius: 6px; padding: 10px;
    }
    textarea { height: 80px; }
    button {
      width: 100%; padding: 12px; background: #2196f3; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-size: 16px;
    }
    button:hover { background: #1976d2; }

    /* Base styles already defined, now add responsiveness */
@media (max-width: 1024px) {
  .task-board {
    gap: 15px;
  }
  .task-card {
    width: 45%; /* two cards per row on tablets */
  }
}

@media (max-width: 768px) {
  body {
    padding: 20px;
  }
  .task-card {
    width: 100%; /* full width on small screens */
  }
  h2 {
    font-size: 20px;
  }
  button {
    font-size: 14px;
    padding: 10px 16px;
  }
}

@media (max-width: 480px) {
  h2 {
    font-size: 18px;
  }
  .task-card {
    padding: 15px;
  }
  button {
    font-size: 13px;
    padding: 8px 12px;
  }
}

  </style>
</head>
<body>
  <div class="container">
    <h2>Upload Task</h2>
    <div class="drop-box" id="dropBox">Drag & Drop File Here</div>
    <input type="file" id="fileInput" hidden>
    <textarea id="desc" placeholder="Enter task description..."></textarea>
    <label for="sendTo">Where to send:</label>
    <select id="sendTo">
      <option value="public">Public</option>
      <option value="zei">Zei</option>
    </select>
    <button onclick="submitTask()">Submit Task</button>
  </div>

  <script>
    const dropBox = document.getElementById('dropBox');
    const fileInput = document.getElementById('fileInput');
    let fileData = null;

    dropBox.addEventListener('click', () => fileInput.click());
    dropBox.addEventListener('dragover', e => { e.preventDefault(); dropBox.style.background = '#e3f2fd'; });
    dropBox.addEventListener('dragleave', () => dropBox.style.background = '');
    dropBox.addEventListener('drop', e => {
      e.preventDefault();
      fileData = e.dataTransfer.files[0];
      dropBox.textContent = "File: " + fileData.name;
    });

    fileInput.addEventListener('change', () => {
      fileData = fileInput.files[0];
      dropBox.textContent = "File: " + fileData.name;
    });

    async function submitTask() {
      const desc = document.getElementById('desc').value;
      const sendTo = document.getElementById('sendTo').value;

      if (!fileData || !desc) {
        alert("Please add a file and description!");
        return;
      }

      const formData = new FormData();
      formData.append('taskFile', fileData);
      formData.append('description', desc);
      formData.append('sendTo', sendTo);

      const res = await fetch('https://sharedtask.onrender.com/upload', {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      alert(data.message);
      location.href = 'board.html';
    }
  </script>
</body>
</html>

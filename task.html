<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/jpeg" href="S.jpg" sizes="16x16">
  <link rel="icon" type="image/jpeg" href="S.jpg" sizes="32x32">
  <link rel="icon" type="image/jpeg" href="S.jpg" sizes="48x48">
  <meta charset="UTF-8">
  <title>Upload Task</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff;
      overflow-x: hidden;
    }

    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: #111;
      z-index: -1;
    }

    .container {
      position: relative;
      width: 90%;
      max-width: 600px;
      background: rgba(10, 24, 34, 0.12);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(33, 203, 243, 0.45);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25), 0 0 18px rgba(33,203,243,0.12);
      margin: 40px auto;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #21cbf3;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.4);
    }

    /* Drop Box */
    .drop-box {
      width: 100%;
      min-height: 120px;
      border: 2px dashed #21cbf3;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      cursor: pointer;
      color: #eee;
      text-align: center;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }
    .drop-box:hover {
      box-shadow: 0 0 12px #21cbf3;
    }

    .drop-box.drag-over {
      background: rgba(33,203,243,0.16);
      box-shadow: 0 0 18px #21cbf3;
    }

    .selected-files {
      width: 100%;
      box-sizing: border-box;
      margin: -5px 0 15px;
      padding: 0;
      list-style: none;
      color: #dffaff;
      font-size: 0.9rem;
    }

    .selected-files li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 8px;
      margin-top: 5px;
      background: rgba(0,0,0,0.2);
      border-radius: 5px;
      overflow-wrap: anywhere;
    }

    .selected-files li span {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .remove-file-btn {
      flex: 0 0 auto;
      width: 28px;
      min-height: 28px;
      margin: 0;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 50%;
      background: transparent;
      color: #ff8a80;
      font-size: 18px;
      line-height: 1;
    }

    .remove-file-btn:hover {
      background: rgba(255,82,82,0.18);
      box-shadow: 0 0 8px rgba(255,82,82,0.55);
    }

    .file-count {
      color: #9edbe9;
      font-size: 0.85rem;
    }

    /* Name Textarea */
    .name-box {
      width: 50;
      margin-bottom: 15px;
      border: 1px solid #4caf50;
      border-radius: 6px;
      padding: 12px;
      font-size: 14px;
      color: #333;
      background: #f9fff9;
    }

    /* Description Textarea */
    .desc-box {
      width: 95%;
      min-height: 100px;
      margin-bottom: 15px;
      border: 1px solid #2196f3;
      border-radius: 6px;
      padding: 12px;
      font-size: 14px;
      color: #333;
      background: #f9fbff;
      resize: vertical;
    }

    /* Select Box */
    .select-box {
      width: 70%;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 10px;
      font-size: 14px;
      color: #333;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2196f3;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    button:hover {
      background: #1976d2;
      box-shadow: 0 0 12px #2196f3;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      opacity: 0.7;
      color: #fff;
    }

    /* Responsive Adjustments */
    @media (max-width: 768px) {
      .container { padding: 20px; }
      h2 { font-size: 20px; }
      button { font-size: 14px; padding: 10px; }
      .desc-box { min-height: 80px; }
    }

    @media (max-width: 480px) {
      .container { padding: 15px; }
      h2 { font-size: 18px; }
      button { font-size: 13px; padding: 8px; }
      .drop-box { min-height: 100px; font-size: 14px; }
      .name-box, .desc-box, .select-box { font-size: 13px; }
    }
  </style>
</head>
<body>
  <canvas id="grid"></canvas>
  <div class="container">
    <h2>Upload Task</h2>

    <div class="drop-box" id="dropBox">Drag & Drop Files Here (up to 10)</div>
    <input type="file" id="fileInput" multiple hidden>
    <ul class="selected-files" id="selectedFiles" aria-live="polite"></ul>

    <textarea id="userName" class="name-box" placeholder="Enter your name"></textarea>
    <textarea id="desc" class="desc-box" placeholder="Enter task description..."></textarea>

    <label for="sendTo">Where to send:</label>
    <select id="sendTo" class="select-box">
      <option value="public">Public (Visible to all)</option>
      <option value="zei">Zei (Visible to Zei only)</option>
    </select>

    <button onclick="submitTask()">Submit Task</button>

    <div class="footer">
      Developed by Shawn Kent S. Prades
    </div>
  </div>

  <script>
    // 🔹 Glow Grid Background
    const canvas = document.getElementById("grid");
    const ctx = canvas.getContext("2d");
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    let mouse = { x: -9999, y: -9999 };
    const squareSize = 80;
    const grid = [];

    function initGrid() {
      grid.length = 0;
      for (let x = 0; x < width; x += squareSize) {
        for (let y = 0; y < height; y += squareSize) {
          grid.push({ x, y, alpha: 0, fading: false, lastTouched: 0 });
        }
      }
    }

    function getCellAt(x, y) {
      return grid.find(cell =>
        x >= cell.x && x < cell.x + squareSize &&
        y >= cell.y && y < cell.y + squareSize
      );
    }

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initGrid();
    });

    window.addEventListener("mousemove", (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      const cell = getCellAt(mouse.x, mouse.y);
      if (cell && cell.alpha === 0) {
        cell.alpha = 1;
        cell.lastTouched = Date.now();
        cell.fading = false;
      }
    });

    function drawGrid() {
      ctx.clearRect(0, 0, width, height);
      const now = Date.now();
      for (let cell of grid) {
        if (cell.alpha > 0 && !cell.fading && now - cell.lastTouched > 500) {
          cell.fading = true;
        }
        if (cell.fading) {
          cell.alpha -= 0.02;
          if (cell.alpha <= 0) { cell.alpha = 0; cell.fading = false; }
        }
        if (cell.alpha > 0) {
          const centerX = cell.x + squareSize / 2;
          const centerY = cell.y + squareSize / 2;
          const gradient = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, squareSize);
          gradient.addColorStop(0, `rgba(0, 255, 204, ${cell.alpha})`);
          gradient.addColorStop(1, `rgba(0, 255, 204, 0)`);
          ctx.strokeStyle = gradient;
          ctx.lineWidth = 1.3;
          ctx.strokeRect(cell.x + 0.5, cell.y + 0.5, squareSize - 1, squareSize - 1);
        }
      }
      requestAnimationFrame(drawGrid);
    }
    initGrid();
    drawGrid();

    // 🔹 Upload Logic
    const dropBox = document.getElementById('dropBox');
    const fileInput = document.getElementById('fileInput');
    const selectedFiles = document.getElementById('selectedFiles');
    let fileData = [];

    dropBox.addEventListener('click', () => fileInput.click());
    dropBox.addEventListener('dragenter', e => {
      e.preventDefault();
      dropBox.classList.add('drag-over');
    });

    dropBox.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
      dropBox.classList.add('drag-over');
    });

    dropBox.addEventListener('dragleave', e => {
      if (!dropBox.contains(e.relatedTarget)) dropBox.classList.remove('drag-over');
    });

    dropBox.addEventListener('drop', e => {
      e.preventDefault();
      dropBox.classList.remove('drag-over');
      setFiles(Array.from(e.dataTransfer.files));
    });

    fileInput.addEventListener('change', () => {
      setFiles(Array.from(fileInput.files));
    });

    function setFiles(files) {
      const newFiles = files.filter(file => !fileData.some(existingFile =>
        existingFile.name === file.name &&
        existingFile.size === file.size &&
        existingFile.lastModified === file.lastModified
      ));
      const availableSlots = 10 - fileData.length;

      if (newFiles.length > availableSlots) {
        alert('You can upload a maximum of 10 files per submission.');
      }

      fileData = fileData.concat(newFiles.slice(0, Math.max(0, availableSlots)));
      fileInput.value = '';
      renderSelectedFiles();
    }

    function renderSelectedFiles() {
      selectedFiles.innerHTML = '';
      dropBox.textContent = fileData.length
        ? `${fileData.length} file${fileData.length === 1 ? '' : 's'} selected`
        : 'Drag & Drop Files Here (up to 10)';
      fileData.forEach((file, index) => {
        const item = document.createElement('li');
        const name = document.createElement('span');
        name.textContent = file.name;
        const removeButton = document.createElement('button');
        removeButton.type = 'button';
        removeButton.className = 'remove-file-btn';
        removeButton.title = `Remove ${file.name}`;
        removeButton.setAttribute('aria-label', `Remove ${file.name}`);
        removeButton.textContent = '×';
        removeButton.addEventListener('click', () => {
          fileData.splice(index, 1);
          renderSelectedFiles();
        });
        item.append(name, removeButton);
        selectedFiles.appendChild(item);
      });
    }

    async function submitTask() {
      const userName = document.getElementById('userName').value.trim();
      const desc = document.getElementById('desc').value.trim();
      const sendTo = document.getElementById('sendTo').value;

      if (!fileData.length || !userName || !desc) {
        alert("Please add your name, at least one file, and a description!");
        return;
      }

      const formData = new FormData();
      formData.append('userName', userName);
      fileData.forEach(file => formData.append('taskFiles', file));
      formData.append('description', desc);
      formData.append('sendTo', sendTo);

      try {
        const res = await fetch('https://sharedtask.onrender.com/upload', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Upload failed.');
        alert(data.message);
        location.href = 'board.html';
      } catch (error) {
        alert(error.message || "Upload failed. Please try again.");
        console.error(error);
      }
    }
  </script>
</body>
</html>

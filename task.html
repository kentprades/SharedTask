<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Task</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- ✅ Responsive scaling -->
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #2196f3;
    }

    .drop-box {
      width: 100%;
      height: 150px;
      border: 2px dashed #2196f3;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      cursor: pointer;
      color: #555;
      transition: background 0.3s ease;
    }

    textarea, select {
      width: 100%;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 10px;
      font-size: 14px;
    }

    textarea {
      height: 80px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2196f3;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #1976d2;
    }

    /* ✅ Responsive adjustments */
    @media (max-width: 768px) {
      body {
        padding: 20px;
      }
      .container {
        padding: 20px;
      }
      h2 {
        font-size: 20px;
      }
      button {
        font-size: 14px;
        padding: 10px;
      }
    }

    @media (max-width: 480px) {
      h2 {
        font-size: 18px;
      }
      .container {
        padding: 15px;
      }
      button {
        font-size: 13px;
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Upload Task</h2>
    <div class="drop-box" id="dropBox">Drag & Drop File Here</div>
    <input type="file" id="fileInput" hidden>
    <textarea id="userName" placeholder="Enter your name"></textarea>
    <textarea id="desc" placeholder="Enter task description..."></textarea>
    <label for="sendTo">Where to send:</label>
    <select id="sendTo">
      <option value="public">Public</option>
      <option value="zei">Zei</option>
    </select>
    <button onclick="submitTask()">Submit Task</button>
  </div>

  <script>
    const dropBox = document.getElementById('dropBox');
    const fileInput = document.getElementById('fileInput');
    let fileData = null;

    dropBox.addEventListener('click', () => fileInput.click());
    dropBox.addEventListener('dragover', e => {
      e.preventDefault();
      dropBox.style.background = '#e3f2fd';
    });
    dropBox.addEventListener('dragleave', () => dropBox.style.background = '');
    dropBox.addEventListener('drop', e => {
      e.preventDefault();
      fileData = e.dataTransfer.files[0];
      dropBox.textContent = "File: " + fileData.name;
      dropBox.style.background = '';
    });

    fileInput.addEventListener('change', () => {
      fileData = fileInput.files[0];
      dropBox.textContent = "File: " + fileData.name;
    });

    async function submitTask() {
      const desc = document.getElementById('desc').value;
      const sendTo = document.getElementById('sendTo').value;

      if (!fileData || !desc) {
        alert("Please add a file and description!");
        return;
      }

      const formData = new FormData();
      formData.append('taskFile', fileData);
      formData.append('description', desc);
      formData.append('sendTo', sendTo);

      const res = await fetch('https://sharedtask.onrender.com/upload', {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      alert(data.message);
      location.href = 'board.html';
    }
  </script>
</body>
</html>

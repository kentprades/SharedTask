<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shared Task </title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- ✅ Responsive scaling -->
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #2196f3, #21cbf3);
      color: #fff;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      margin-bottom: 40px;
      font-size: 2.5rem;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.2);
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 600px;
    }

    button {
      flex: 1 1 200px;
      padding: 15px 30px;
      font-size: 18px;
      background: #fff;
      color: #2196f3;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    button:hover {
      background: #f1f1f1;
      transform: translateY(-3px);
    }

    /* ✅ Responsive adjustments */
    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
        margin-bottom: 30px;
      }
      button {
        font-size: 16px;
        padding: 12px 24px;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.6rem;
        margin-bottom: 20px;
      }
      .button-group {
        flex-direction: column;
        gap: 15px;
      }
      button {
        width: 100%;
        font-size: 15px;
        padding: 10px 20px;
      }
    }
  </style>
</head>
<body>
  <h1>Shared Task</h1>
  <h3>Make the sharing easy!</h3>
  <div class="button-group">
    <button onclick="location.href='task.html'">Upload Task</button>
    <button onclick="location.href='board.html'">See Task Board</button>
  </div>
</body>
</html>

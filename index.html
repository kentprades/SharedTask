<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task System</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #2196f3, #21cbf3);
      color: #fff;
      text-align: center;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    h1 { margin-bottom: 40px; }
    button {
      padding: 15px 30px;
      margin: 15px;
      font-size: 18px;
      background: #fff;
      color: #2196f3;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background: #f1f1f1; }

    /* Base styles already defined, now add responsiveness */
@media (max-width: 1024px) {
  .task-board {
    gap: 15px;
  }
  .task-card {
    width: 45%; /* two cards per row on tablets */
  }
}

@media (max-width: 768px) {
  body {
    padding: 20px;
  }
  .task-card {
    width: 100%; /* full width on small screens */
  }
  h2 {
    font-size: 20px;
  }
  button {
    font-size: 14px;
    padding: 10px 16px;
  }
}

@media (max-width: 480px) {
  h2 {
    font-size: 18px;
  }
  .task-card {
    padding: 15px;
  }
  button {
    font-size: 13px;
    padding: 8px 12px;
  }
}

  </style>
</head>
<body>
  <h1>Welcome to the Task System</h1>
  <button onclick="location.href='task.html'">Upload Task</button>
  <button onclick="location.href='board.html'">See Task Board</button>
</body>
</html>
